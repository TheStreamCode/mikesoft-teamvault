name: Feature request
description: Propose a focused improvement to the plugin or repository
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed change.
        User-facing support questions belong in the WordPress.org support forum linked on the previous screen.
        Large features usually need a maintainer decision before an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Desired behavior, alternatives considered, and what it must not break.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Affected WordPress or PHP versions, configuration, permissions, or public hooks.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
