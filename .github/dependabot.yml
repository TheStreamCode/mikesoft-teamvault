version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      composer-development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # PHPUnit 13 requires PHP >= 8.4, while TeamVault intentionally tests and
      # supports older PHP versions. Revisit this when the PHP floor is raised.
      - dependency-name: phpunit/phpunit
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
