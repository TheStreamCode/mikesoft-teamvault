# Dependency updates for the Composer development tooling and the GitHub Actions workflows.
version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      composer-dev:
        patterns: ["*"]
    ignore:
      # PHPUnit 13 requires PHP >= 8.4.1; the CI matrix still runs 8.2 and 8.3.
      # Remove this rule when the matrix moves to 8.4.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
